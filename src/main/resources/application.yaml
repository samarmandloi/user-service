spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/user_db}
    username: ${DB_USERNAME:samar}
    password: ${DB_PASSWORD:samar}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8083

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:${user.home}/.config/ecommerce/user-service/jwt/private.pem}
  expiration-seconds: 300
